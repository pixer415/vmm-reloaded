name: Publish image

# Builds the container and pushes it to this repository's own GitHub Container
# Registry namespace. GITHUB_TOKEN is created automatically for each run, so
# there is no access token to generate and no docker login to do by hand.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this, which ghcr.io requires.
          images: ghcr.io/${{ github.repository_owner }}/virt-manager-reloaded
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the GL stack this image exists for is amd64, and so is
          # every ZimaOS device. Building arm64 under emulation would take an
          # hour to produce something nobody can use.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
