# VMM Reloaded - virt-manager for ZimaOS, with its own hypervisor.
#
# Own-hypervisor mode: this container runs its own libvirtd and its own QEMU,
# built with the OpenGL/virgl modules, rather than driving the libvirtd that
# ZimaOS uses for ZVM. That is what makes guest 3D acceleration possible on a
# box whose host QEMU has no GL support. The trade-off is that VMs created here
# do not appear on ZimaOS's own Virtual Machine page.
#
# ZimaOS installs from a registry and cannot build from source;
# .github/workflows/publish-image.yml builds and pushes the image on every push
# to main, and tags it with the version below when you push a matching git tag.
#
# No dollar sign appears in this file on purpose: ZimaOS reduces the compose
# escape form when it saves, and docker compose then substitutes empty string.

name: virt-manager-reloaded

services:
  virt-manager-reloaded:
    image: ghcr.io/pixer415/virt-manager-reloaded:1.1.1
    container_name: virt-manager-reloaded
    hostname: virt-manager-reloaded
    restart: unless-stopped

    ports:
      - mode: ingress
        target: 80
        published: "8185"
        protocol: tcp

    environment:
      # Run libvirtd and QEMU inside this container. This is the whole point of
      # the app; setting it to "N" turns it back into a client for some other
      # libvirtd and gives up the GPU support.
      LIBVIRTD: "Y"
      # Connect to the daemon this container runs.
      HOSTS: "['qemu:///system']"
      # Look for a DRM render node at startup. Guests fall back to software
      # rendering, with a line in the log, if none is usable.
      GPU: "Y"
      # Pin a render node such as "/dev/dri/renderD129" on a box with more than
      # one GPU. Empty autodetects.
      RENDERNODE: ""
      # Start libvirt's "default" NAT network so guests get networking. Needs
      # the NET_ADMIN capability and /dev/net/tun, both granted below.
      LIBVIRT_NETWORK: "Y"
    # Put guests straight on your LAN through a spare NIC, so your router hands
    # them their own addresses. Needs the macvlan network at the bottom of this
    # file; leave it "N" unless you have set that up.
      VM_BRIDGE: "N"
    # Which interface inside the container is the spare NIC. Empty autodetects
    # the one that is not carrying the container's own route.
      VM_BRIDGE_UPLINK: ""
      DARK_MODE: "false"

    volumes:
      # Guest disk images. Repoint this at a larger pool if you keep big VMs -
      # /DATA/AppData sits on the system volume.
      - /DATA/AppData/virt-manager-reloaded/images:/var/lib/libvirt/images
      # VM definitions and the default network, so they survive an app update.
      - /DATA/AppData/virt-manager-reloaded/config:/etc/libvirt/qemu
      # UEFI boot variables. A guest with UEFI firmware that loses these still
      # has its disk but no longer boots.
      - /DATA/AppData/virt-manager-reloaded/nvram:/var/lib/libvirt/qemu/nvram
      # Emulated TPM state, which a Windows 11 guest needs to keep.
      - /DATA/AppData/virt-manager-reloaded/swtpm:/var/lib/libvirt/swtpm
      # Installer ISOs, read-only.
      - /DATA/Media:/DATA/Media:ro

    devices:
      # Hardware virtualisation. Without it guests run under TCG emulation.
      - /dev/kvm:/dev/kvm
      # The GPU. This is the device that makes 3D acceleration work.
      - /dev/dri:/dev/dri
      # Guest network interfaces.
      - /dev/net/tun:/dev/net/tun

    cap_add:
      # libvirt builds the guest bridge and its NAT rules inside this
      # container's own network namespace.
      - NET_ADMIN
      # Docker mounts /proc/sys read-only, and libvirt's network driver has to
      # write to it to bring virbr0 up. NET_ADMIN creates the bridge but cannot
      # tune it; SYS_ADMIN lets the container remount /proc/sys for itself.
      # Drop this and guests get no networking - everything else still works.
      - SYS_ADMIN

    sysctls:
      # Set at creation, when /proc/sys is still writable, so forwarding is
      # already on by the time libvirt looks.
      - net.ipv4.ip_forward=1

x-casaos:
  architectures:
    - amd64
  main: virt-manager-reloaded
  id: io.github.pixer415.virt-manager-reloaded
  store_app_id: virt-manager-reloaded
  version: 1.1.1
  author: pixer415
  developer: pixer415
  category: Developer
  icon: icon.svg
  thumbnail: ""
  index: /
  port_map: "8185"
  scheme: http
  website: https://github.com/pixer415/vmm-reloaded
  repo: https://github.com/pixer415/vmm-reloaded
  support: https://github.com/pixer415/vmm-reloaded/issues
  title:
    custom: VMM Reloaded
    en_US: VMM Reloaded
  tagline:
    en_US: virt-manager with its own hypervisor, and guest GPU acceleration
  description:
    en_US: |
      **VMM Reloaded** is the full virt-manager interface in your browser, with
      a hypervisor of its own, so guests can render on the box's GPU.

      - The real virt-manager UI over GTK Broadway - no VNC or RDP client
      - Ships its own QEMU built with the OpenGL and virgl modules
      - A **GPU Acceleration** window: one switch per machine, no terminal
      - Full XML editing, snapshots, storage pools, USB passthrough
      - Guest consoles stream in the browser, accelerated or not

      **This app brings its own libvirtd.** It does not drive the one behind
      ZimaOS's Virtual Machine page, so VMs created here will not show up
      there, and VMs created there will not show up here. That separation is
      deliberate: it is what lets the app ship a QEMU with GPU support on a
      system whose own QEMU may not have it.

      **Turning on 3D for a guest.** Create the VM as usual, then switch to the
      **GPU Acceleration** window that opens beside Virtual Machine Manager. It
      lists every machine with a switch; flick the switch and restart the VM.
      **Check GPU** in that window reports on the whole chain - render node,
      QEMU modules, Mesa, libvirt - and names any layer that is missing.

      Do not use the **OpenGL** checkbox on virt-manager's own Display page. It
      selects SPICE's local-only dmabuf path, which a browser cannot display;
      the switch sets up the arrangement that does work.

      **If you prefer the command line,** the terminal icon at the bottom left
      opens a tmux session with `shell` in front and `virt-manager` behind it,
      carrying the program's output and any SSH password prompt. `virt-3d list`,
      `virt-3d enable <vm>` and `virt-gpu-check` do the same jobs there.
  tips:
    before_install:
      en_US: |
        **This app runs its own hypervisor.** VMs you create here will not
        appear on ZimaOS's Virtual Machine page, and vice versa. Install it as
        a replacement for that page, not an addition to it.

        **Hardware.** `/dev/kvm` is needed for usable speed and `/dev/dri` for
        guest 3D. Both are granted below. The app still starts without them,
        with a warning in the log and software rendering.

        **Storage.** Guest disks default to
        `/DATA/AppData/virt-manager-reloaded/images`, which lives on the system
        volume. Point that mount at a larger pool before you build big VMs.

        **After installing,** open the tile, create a VM, then use the **GPU
        Acceleration** window that opens beside Virtual Machine Manager: one
        switch per machine, then restart the machine. No command line needed.

# ---------------------------------------------------------------------------
# Optional: give guests real addresses from your router.
#
# Needs a second NIC that nothing else on the box is using. Guest frames leave
# on that NIC with their own MACs, so your router sees them as ordinary
# machines - the same arrangement as vmbr0 on Proxmox.
#
# Three edits, all of them in this file. No commands on the ZimaOS host.
#
#  1. Uncomment the networks: block at the bottom, and set "parent" to your
#     spare NIC's name on the host (ip link, e.g. enp2s0). The subnet only has
#     to be a range Docker can hand one unused address from; guests do not use
#     it, they get their addresses from your router.
#
#  2. Uncomment the two network entries under the service, so the app keeps its
#     normal bridge for the web UI *and* gains the macvlan. Both are required:
#     the app refuses to enslave an interface that carries its only route.
#
#  3. Set VM_BRIDGE to "Y" above.
#
# macvlan_mode: passthru is not optional. In the default bridge mode a macvlan
# only accepts frames addressed to its own MAC, so replies to a guest are
# dropped. Passthru hands the container the whole NIC and permits the guest
# MACs. It also means nothing else can share that NIC.
#
#    networks:
#      - default
#      - vmlan
#
# networks:
#   default:
#   vmlan:
#     driver: macvlan
#     driver_opts:
#       parent: eth0
#       macvlan_mode: passthru
#     ipam:
#       config:
#         - subnet: 192.168.0.0/24
#           gateway: 192.168.0.1
#           ip_range: 192.168.0.250/32
#
# Guests then pick the "lan" network in virt-manager. The NAT "default" network
# stays available, so you can mix the two per machine.
# ---------------------------------------------------------------------------
