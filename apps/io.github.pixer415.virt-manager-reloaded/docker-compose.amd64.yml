# VMM Reloaded - virt-manager for ZimaOS, with its own hypervisor.
#
# Own-hypervisor mode: this container runs its own libvirtd and its own QEMU,
# built with the OpenGL/virgl modules, rather than driving the libvirtd that
# ZimaOS uses for ZVM. That is what makes guest 3D acceleration possible on a
# box whose host QEMU has no GL support. The trade-off is that VMs created here
# do not appear on ZimaOS's own Virtual Machine page.
#
# ZimaOS installs from a registry and cannot build from source;
# .github/workflows/publish-image.yml builds and pushes the image on every push
# to main, and tags it with the version below when you push a matching git tag.
#
# No dollar sign appears in this file on purpose: ZimaOS reduces the compose
# escape form when it saves, and docker compose then substitutes empty string.

name: virt-manager-reloaded

services:
  virt-manager-reloaded:
    image: ghcr.io/pixer415/virt-manager-reloaded:1.0.1
    container_name: virt-manager-reloaded
    hostname: virt-manager-reloaded
    restart: unless-stopped

    ports:
      - mode: ingress
        target: 80
        published: "8185"
        protocol: tcp

    environment:
      # Run libvirtd and QEMU inside this container. This is the whole point of
      # the app; setting it to "N" turns it back into a client for some other
      # libvirtd and gives up the GPU support.
      LIBVIRTD: "Y"
      # Connect to the daemon this container runs.
      HOSTS: "['qemu:///system']"
      # Look for a DRM render node at startup. Guests fall back to software
      # rendering, with a line in the log, if none is usable.
      GPU: "Y"
      # Pin a render node such as "/dev/dri/renderD129" on a box with more than
      # one GPU. Empty autodetects.
      RENDERNODE: ""
      # Start libvirt's "default" NAT network so guests get networking. Needs
      # the NET_ADMIN capability and /dev/net/tun, both granted below.
      LIBVIRT_NETWORK: "Y"
      DARK_MODE: "false"

    volumes:
      # Guest disk images. Repoint this at a larger pool if you keep big VMs -
      # /DATA/AppData sits on the system volume.
      - /DATA/AppData/virt-manager-reloaded/images:/var/lib/libvirt/images
      # VM definitions and the default network, so they survive an app update.
      - /DATA/AppData/virt-manager-reloaded/config:/etc/libvirt/qemu
      # Installer ISOs, read-only.
      - /DATA/Media:/DATA/Media:ro

    devices:
      # Hardware virtualisation. Without it guests run under TCG emulation.
      - /dev/kvm:/dev/kvm
      # The GPU. This is the device that makes 3D acceleration work.
      - /dev/dri:/dev/dri
      # Guest network interfaces.
      - /dev/net/tun:/dev/net/tun

    cap_add:
      # libvirt builds the guest bridge and its NAT rules inside this
      # container's own network namespace.
      - NET_ADMIN

x-casaos:
  main: virt-manager-reloaded
  id: io.github.pixer415.virt-manager-reloaded
  version: 1.0.1
  icon: https://pixer415.github.io/vmm-reloaded/apps/io.github.pixer415.virt-manager-reloaded/assets/icon.svg
  index: /
  port_map: "8185"
  scheme: http
  title:
    custom: VMM Reloaded
    en_US: VMM Reloaded
